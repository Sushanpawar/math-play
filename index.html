.tb.on{background:var(--accent);color:#fff}
.sk{font-weight:700;margin:6px 8px 10px}
.rows{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 6px 10px}
.tr{padding:10px 6px;border-radius:10px;background:var(--soft);font-weight:700;font-size:1.2rem;animation:pop .3s backwards}

.pg p{font-size:1.5rem;line-height:1.5;font-weight:600;margin:6px 10px 14px;min-height:130px}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}

function resetNL(){hi=0;renderNL()}
function renderNL(){
  var el=$("nl");if(!nlOn||!cur){el.hidden=true;return}el.hidden=false;
  var a=cur.a,b=cur.b,t=cur.t,N=t==="+"?a+b:t==="×"?a*b:a,s=t==="×"?0:a;
  var X=function(n){return 20+n*440/N},lab=N<=20?1:N<=50?5:N<=150?10:N<=500?50:100,pos=hi?plan[hi-1][1]:s,i,n;
  var g='<svg viewBox="0 0 480 100"><line x1="12" y1="70" x2="468" y2="70" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>';
  for(n=0;n<=N;n++){var big=n%lab===0||n===s||n===pos;
    if(N<=50||n%(N<=150?5:10)===0)g+='<line x1="'+X(n)+'" y1="'+(big?63:66)+'" x2="'+X(n)+'" y2="74" stroke="currentColor" stroke-width="2"/>';
    if(big)g+='<text x="'+X(n)+'" y="92" text-anchor="middle" font-size="'+(n===s||n===pos?15:11)+'" font-weight="'+(n===s||n===pos?800:500)+'" fill="'+(n===s||n===pos?'var(--accent)':'currentColor')+'">'+n+'</text>'}
  for(i=0;i<hi;i++){var f=plan[i][0],e=plan[i][1],w=Math.abs(X(e)-X(f));
    g+='<path class="arc'+(i===hi-1?' new':'')+'" d="M'+X(f)+' 68 Q'+((X(f)+X(e))/2)+' 14 '+X(e)+' 68"/>';
    if(w>=20)g+='<text x="'+((X(f)+X(e))/2)+'" y="40" text-anchor="middle" font-size="13" font-weight="800" fill="var(--accent)">'+(i+1)+'</text>'}
  g+='<text x="'+X(pos)+'" y="62" text-anchor="middle" font-size="24">'+$("pal").textContent+'</text></svg>';
  var how={"+":"Start at "+a+". Hop forward "+b+".","−":"Start at "+a+". Hop back "+b+".","×":a+" hops of "+b+", starting at 0.","÷":"Start at "+a+". Hop back "+b+" each time until 0. Count the hops!"}[t];
  var done=hi===plan.length,cap=done?(t==="÷"?"You hopped "+hi+" times!":"You landed on "+pos+"!"):how+(hi?" Hops: "+hi:"");
  el.innerHTML=g+'<div class="cap">'+cap+'</div><button class="chip" onclick="hop()"'+(done?' disabled style="opacity:.4"':'')+'>Hop ▶</button><button class="chip" onclick="resetNL()">↺</button>';
}
function anim(c){var p=$("pal");p.className="pal";void p.offsetWidth;p.className="pal "+c}
function confetti(){var c=["#ff5e7e","#ffc93c","#1fb36b","#6c4cf1","#2bb3ff"];
  for(var i=0;i<26;i++){var e=document.createElement("i");e.className="bit";e.style.left=rnd(2,96)+"%";e.style.background=c[i%5];e.style.animationDelay=(Math.random()*.3)+"s";$("card").appendChild(e);setTimeout(function(x){x.remove()},1700,e)}}
function pick(bt,v){
  if(locked)return;locked=true;
  if(v===ans){bt.className="right";score++;streak++;if(streak>best)best=streak;
    $("msg").textContent=cheers[rnd(0,4)]+(streak>=3?" 🔥":"");anim("win");confetti();
    if(score%5===0){$("pal").textContent=pals[(score/5)%pals.length];$("msg").textContent="Level up! 🚀"+(S==="lr"?" Brain break: "+BR[rnd(0,3)]:"")}
    setTimeout(next,950)}
  else{bt.className="wrong";streak=0;anim("lose");$("msg").textContent="Almost! It's "+ans;
    var bs=$("opts").children;for(var i=0;i<bs.length;i++)if(bs[i].textContent===ans)bs[i].className="right";setTimeout(next,1600)}
  $("score").textContent=score;$("streak").textContent=streak;$("best").textContent=best;
  $("bar").style.width=((score%5)||(score>0?5:0))*20+"%";
}
function start(id,o){stopBub();ex=o||{};try{speechSynthesis.cancel()}catch(e){}
  S=id;score=streak=best=0;mode=0;$("score").textContent=$("streak").textContent=$("best").textContent=0;$("bar").style.width="0";
  var s=ex;$("title").textContent=s.e+" "+s.n+" · Grade "+G;$("msg").textContent="Pick the right answer!";
  var m=$("modes");m.innerHTML="";
  if(id==="math")ops.forEach(function(o,i){var b=document.createElement("button");b.className="chip"+(i?"":" on");b.textContent=o;b.onclick=function(){mode=i;for(var j=0;j<ops.length;j++)m.children[j].className="chip"+(j===i?" on":"");next()};m.appendChild(b)});
  if(id==="math"){var rb=document.createElement("button");rb.className="chip"+(nlOn?" on":"");rb.textContent="📏";rb.title="Number line";rb.onclick=function(){nlOn=!nlOn;rb.className="chip"+(nlOn?" on":"");renderNL()};m.appendChild(rb)}
  var cu=id==="mem"||id==="simon"||id==="bub"||id==="tables"||id==="story"||id==="enc"||id==="trace";cur=null;renderNL();$("q").hidden=cu;$("opts").hidden=cu;$("cust").hidden=!cu;$("cust").innerHTML="";$("home").hidden=true;$("game").hidden=false;if(id==="mem"){mem={lv:0};newMem()}else if(id==="simon")initSim();else if(id==="bub")initBub();else if(id==="tables")initTables();else if(id==="trace")initTrace();else if(id==="story")initStory();else if(id==="enc")initEnc();else next();
}
function goHome(){try{speechSynthesis.cancel()}catch(e){}stopBub();S=null;$("game").hidden=true;$("home").hidden=false}
[1,2,3].forEach(function(g){var b=document.createElement("button");b.textContent="Grade "+g;b.className=g===1?"on":"";b.onclick=function(){G=g;var k=$("grades").children;for(var j=0;j<k.length;j++)k[j].className=j===g-1?"on":"";renderExtra()};$("grades").appendChild(b)});
function mkTiles(list,box){list.forEach(function(s,i){var b=document.createElement("button");b.className="tile";b.style.background=s.c;b.style.animationDelay=i*.08+"s";b.innerHTML="<span>"+s.e+"</span>"+s.n+(s.d?"<small>"+s.d+"</small>":"");b.onclick=function(){start(s.id,s)};$(box).appendChild(b)})}
mkTiles(subs,"tiles");mkTiles(brain,"btiles");renderExtra();
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}
</script>
