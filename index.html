<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Play & Learn</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Play & Learn">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#6c4cf1">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#fff7e6;--card:#fff;--ink:#2b2350;--accent:#6c4cf1;--good:#1fb36b;--bad:#ef5b5b;--soft:#ece6ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1633;--card:#26214a;--ink:#f1eeff;--accent:#9d86ff;--soft:#37306b}}
:root[data-theme="dark"]{--bg:#1a1633;--card:#26214a;--ink:#f1eeff;--accent:#9d86ff;--soft:#37306b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:16px;touch-action:manipulation}
.app{width:100%;max-width:520px;text-align:center}
[hidden]{display:none!important}
h1{margin:4px 0 12px;font-size:1.7rem}
.grades{display:flex;gap:8px;justify-content:center;margin-bottom:16px}
.grades button,.chip,.back{border:0;border-radius:14px;background:var(--soft);color:var(--ink);font:700 1.1rem inherit;font-family:inherit;padding:10px 18px;cursor:pointer;transition:transform .15s}
.grades button.on,.chip.on{background:var(--accent);color:#fff;transform:scale(1.08)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:0;border-radius:22px;padding:22px 8px;color:#fff;font-family:inherit;font-weight:800;font-size:1.2rem;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.18);animation:pop .4s backwards;transition:transform .1s}
.tile:active{transform:translateY(4px);box-shadow:none}
.tile span{display:block;font-size:3rem;margin-bottom:4px;animation:bob 2.4s ease-in-out infinite}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.modes{display:flex;gap:8px;justify-content:center;margin-bottom:12px}
.chip{font-size:1.4rem;padding:8px 0;flex:1}
.stats{display:flex;justify-content:space-between;font-weight:700;margin-bottom:10px}
.bar{height:10px;background:var(--soft);border-radius:8px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;width:0;background:var(--good);transition:width .5s cubic-bezier(.3,1.6,.5,1)}
.card{background:var(--card);border-radius:24px;padding:20px 12px;box-shadow:0 6px 0 rgba(0,0,0,.08);position:relative;overflow:hidden}
.pal{font-size:3.4rem;display:inline-block;animation:bob 2s ease-in-out infinite}
.pal.win{animation:jump .7s}.pal.lose{animation:shake .5s}
@keyframes bob{50%{transform:translateY(-8px) rotate(4deg)}}
@keyframes jump{30%{transform:translateY(-40px) scale(1.25) rotate(-12deg)}60%{transform:translateY(0) scale(.9)}100%{transform:none}}
@keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
@keyframes pop{from{transform:scale(.5);opacity:0}}
.q{font-size:2rem;font-weight:800;margin:6px 0 16px;min-height:80px;animation:pop .35s}
.q big{display:block;font-size:4rem;line-height:1.1}
.q.m{font-size:3rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 6px}
.opts button{font:700 1.8rem inherit;font-family:inherit;padding:16px 4px;border:0;border-radius:16px;background:var(--soft);color:var(--ink);cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.12);transition:transform .1s}
.opts.t button{font-size:1.2rem}
.opts button:active{transform:translateY(3px);box-shadow:none}
.opts button.right{background:var(--good);color:#fff;animation:jump .6s}
.opts button.wrong{background:var(--bad);color:#fff;animation:shake .4s}
.msg{height:28px;margin-top:12px;font-weight:700;font-size:1.1rem}
.nl{background:var(--soft);border-radius:16px;padding:8px 6px 10px;margin:0 6px 14px}
.nl svg{width:100%;height:auto;display:block}
.nl .cap{font-weight:700;font-size:.95rem;margin:2px 0 8px;min-height:22px}
.nl .chip{font-size:1rem;padding:8px 16px;flex:none;margin:0 4px}
.arc{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round}
.arc.new{animation:fadein .4s}
@keyframes fadein{from{opacity:0}}
.bit{position:absolute;top:-10px;width:10px;height:14px;border-radius:2px;animation:fall 1.2s ease-in forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(420px) rotate(720deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
 <div id="home">
  <h1>🎈 Play & Learn</h1>
  <div class="grades" id="grades"></div>
  <div class="tiles" id="tiles"></div>
 </div>
 <div id="game" hidden>
  <div class="top"><button class="back" onclick="goHome()">⬅ Home</button><b id="title"></b></div>
  <div class="modes" id="modes"></div>
  <div class="stats"><span>⭐ <b id="score">0</b></span><span>🔥 Streak <b id="streak">0</b></span><span>Best <b id="best">0</b></span></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="card" id="card">
   <div class="pal" id="pal">🐸</div>
   <div class="q" id="q"></div>
   <div id="nl" class="nl" hidden></div>
   <div class="opts" id="opts"></div>
   <div class="msg" id="msg"></div>
  </div>
 </div>
</div>
<script>
var $=function(i){return document.getElementById(i)};
var rnd=function(a,b){return Math.floor(Math.random()*(b-a+1))+a};
var shuf=function(a){return a.slice().sort(function(){return Math.random()-.5})};
var G=1,S=null,mode=0,score=0,streak=0,best=0,locked=false,ans;
var pals=["🐸","🐼","🦊","🐙","🦄","🐯"],cheers=["Awesome!","Nailed it!","Brilliant!","Boom!","You rock!"];
var subs=[{id:"math",n:"Math",e:"🔢",c:"#6c4cf1"},{id:"spell",n:"Spelling",e:"🔤",c:"#e8590c"},{id:"sci",n:"Science",e:"🔬",c:"#1fa971"},{id:"read",n:"Reading",e:"📖",c:"#d6336c"}];
var ops=["+","−","×","÷"];
var SP={1:[["🐱","cat"],["🐶","dog"],["☀️","sun"],["🎩","hat"],["🐷","pig"],["🥤","cup"],["🚌","bus"],["🐟","fish"],["🐸","frog"],["⭐","star"]],
2:[["🍎","apple"],["🐯","tiger"],["🐴","horse"],["🏠","house"],["🚂","train"],["☁️","cloud"],["🌸","flower"],["🐵","monkey"],["🐰","rabbit"],["🍊","orange"]]};
var SC={1:[["Which animal says moo?","Cow","Cat","Duck","Frog"],["What is the Sun?","A star","A planet","A moon","A cloud"],["What do fish use to swim?","Fins","Wings","Legs","Ears"],["Which season is coldest?","Winter","Summer","Spring","Fall"],["What do plants need?","Water & sun","Candy","Toys","Snow only"],["Which one can fly?","Bird","Cow","Fish","Snail"],["What do we smell with?","Nose","Eyes","Hands","Ears"],["Water freezes into...","Ice","Steam","Sand","Fire"],["Which is hot?","Fire","Ice","Snow","Rain"],["Which is a mammal?","Dog","Frog","Snake","Ant"]],
2:[["How many legs has an insect?","6","4","8","10"],["Which planet do we live on?","Earth","Mars","Venus","Jupiter"],["A caterpillar becomes a...","Butterfly","Bee","Frog","Bird"],["Which is a solid?","Rock","Milk","Air","Juice"],["What makes a shadow?","Blocked light","Wind","Sound","Cold"],["Which is a reptile?","Snake","Dog","Whale","Owl"],["What do bees make?","Honey","Milk","Silk","Bread"],["Which sense uses ears?","Hearing","Sight","Taste","Smell"],["Steam is water as a...","Gas","Solid","Rock","Snow"],["What is rain?","Falling water","Falling rocks","Wind","Sunlight"]]};
var RD={1:[["Opposite of hot?","cold","warm","big","red"],["Opposite of up?","down","over","top","in"],["Which rhymes with cat?","hat","dog","sun","cup"],["Which rhymes with sun?","fun","moon","star","pig"],["Opposite of big?","small","tall","long","fast"],["Which word starts with B?","ball","cat","dog","sun"],["Which is a naming word?","dog","run","jump","big"],["Opposite of happy?","sad","glad","fun","mad"],["Which word is a color?","red","run","cat","hop"],["Which rhymes with tree?","bee","dog","hat","cup"]],
2:[["Plural of mouse?","mice","mouses","mices","mouse"],["Past tense of run?","ran","runned","runs","running"],["Another word for big?","large","tiny","thin","short"],["Which is a verb?","jump","happy","table","blue"],["Opposite of early?","late","soon","first","quick"],["Plural of child?","children","childs","childes","child"],["Which is an adjective?","fluffy","run","sing","cat"],["Past tense of go?","went","goed","gone","goes"],["Another word for happy?","glad","sad","angry","tired"],["A sentence starts with...","a capital","a number","a comma","a star"]]};
var bag={};
function draw(key,list){if(!bag[key]||!bag[key].length)bag[key]=shuf(list);return bag[key].pop()}
function mathQ(){
  var lv=Math.min(3,Math.floor(score/5)),m=G===1?8+lv*4:30+lv*20,t=ops[mode],a,b,r;
  if(t==="+"){a=rnd(1,m);b=rnd(1,m);r=a+b}
  else if(t==="−"){a=rnd(2,m);b=rnd(1,a);r=a-b}
  else if(t==="×"){var f=G===1?[2,5,10]:[2,3,4,5,6,7,8,9,10];a=f[rnd(0,f.length-1)];b=rnd(1,G===1?5:10);r=a*b}
  else{var f2=G===1?[2,5,10]:[2,3,4,5,6,7,8,9,10];b=f2[rnd(0,f2.length-1)];r=rnd(1,G===1?5:10);a=b*r}
  var set=[r],g=0;while(set.length<4&&g++<60){var d=r+rnd(-5,5);if(d>=0&&set.indexOf(d)<0)set.push(d)}
  return{q:a+" "+t+" "+b+" = ?",cls:"m",ans:r,opts:set,m:{a:a,b:b,t:t}}
}
function spellQ(){
  var w=draw("sp"+G,SP[G]),i=rnd(0,w[1].length-1),L=w[1][i],p=w[1].split("");p[i]="_";
  var set=[L],A="abcdefghijklmnopqrstuvwxyz";while(set.length<4){var c=A[rnd(0,25)];if(set.indexOf(c)<0)set.push(c)}
  return{q:"<big>"+w[0]+"</big>"+p.join(" "),ans:L,opts:set}
}
function listQ(k,bank){var e=draw(k+G,bank[G]);return{q:e[0],ans:e[1],opts:e.slice(1)}}
function next(){
  var x=S==="math"?mathQ():S==="spell"?spellQ():S==="sci"?listQ("sc",SC):listQ("rd",RD);
  ans=String(x.ans);var q=$("q");q.className="q "+(x.cls||"");q.style.animation="none";void q.offsetWidth;q.style.animation="";q.innerHTML=x.q;
  var o=$("opts"),long=false;o.innerHTML="";
  shuf(x.opts).forEach(function(v){v=String(v);if(v.length>3)long=true;var b=document.createElement("button");b.textContent=v;b.onclick=function(){pick(b,v)};o.appendChild(b)});
  o.className="opts"+(long?" t":"");cur=x.m||null;if(cur)buildPlan();renderNL();locked=false;
}

var nlOn=false,cur=null,hi=0,plan=[];
function buildPlan(){
  var a=cur.a,b=cur.b,t=cur.t,p,k,n;plan=[];
  function chunks(n){var c=[],i;if(n>12){for(i=0;i<Math.floor(n/10);i++)c.push(10);n=n%10}for(i=0;i<n;i++)c.push(1);return c}
  if(t==="+"||t==="−"){p=a;chunks(b).forEach(function(s){var q=t==="+"?p+s:p-s;plan.push([p,q]);p=q})}
  else if(t==="×"){for(k=0;k<a;k++)plan.push([k*b,(k+1)*b])}
  else{n=a/b;for(k=0;k<n;k++)plan.push([a-k*b,a-(k+1)*b])}
  hi=0;
}
function hop(){if(hi<plan.length){hi++;renderNL()}}
function resetNL(){hi=0;renderNL()}
function renderNL(){
  var el=$("nl");if(!nlOn||!cur){el.hidden=true;return}el.hidden=false;
  var a=cur.a,b=cur.b,t=cur.t,N=t==="+"?a+b:t==="×"?a*b:a,s=t==="×"?0:a;
  var X=function(n){return 20+n*440/N},lab=N<=20?1:N<=50?5:10,pos=hi?plan[hi-1][1]:s,i,n;
  var g='<svg viewBox="0 0 480 100"><line x1="12" y1="70" x2="468" y2="70" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>';
  for(n=0;n<=N;n++){var big=n%lab===0||n===s||n===pos;
    if(N<=50||n%5===0)g+='<line x1="'+X(n)+'" y1="'+(big?63:66)+'" x2="'+X(n)+'" y2="74" stroke="currentColor" stroke-width="2"/>';
    if(big)g+='<text x="'+X(n)+'" y="92" text-anchor="middle" font-size="'+(n===s||n===pos?15:11)+'" font-weight="'+(n===s||n===pos?800:500)+'" fill="'+(n===s||n===pos?'var(--accent)':'currentColor')+'">'+n+'</text>'}
  for(i=0;i<hi;i++){var f=plan[i][0],e=plan[i][1],w=Math.abs(X(e)-X(f));
    g+='<path class="arc'+(i===hi-1?' new':'')+'" d="M'+X(f)+' 68 Q'+((X(f)+X(e))/2)+' 14 '+X(e)+' 68"/>';
    if(w>=20)g+='<text x="'+((X(f)+X(e))/2)+'" y="40" text-anchor="middle" font-size="13" font-weight="800" fill="var(--accent)">'+(i+1)+'</text>'}
  g+='<text x="'+X(pos)+'" y="62" text-anchor="middle" font-size="24">'+$("pal").textContent+'</text></svg>';
  var how={"+":"Start at "+a+". Hop forward "+b+".","−":"Start at "+a+". Hop back "+b+".","×":a+" hops of "+b+", starting at 0.","÷":"Start at "+a+". Hop back "+b+" each time until 0. Count the hops!"}[t];
  var done=hi===plan.length,cap=done?(t==="÷"?"You hopped "+hi+" times!":"You landed on "+pos+"!"):how+(hi?" Hops: "+hi:"");
  el.innerHTML=g+'<div class="cap">'+cap+'</div><button class="chip" onclick="hop()"'+(done?' disabled style="opacity:.4"':'')+'>Hop ▶</button><button class="chip" onclick="resetNL()">↺</button>';
}
function anim(c){var p=$("pal");p.className="pal";void p.offsetWidth;p.className="pal "+c}
function confetti(){var c=["#ff5e7e","#ffc93c","#1fb36b","#6c4cf1","#2bb3ff"];
  for(var i=0;i<26;i++){var e=document.createElement("i");e.className="bit";e.style.left=rnd(2,96)+"%";e.style.background=c[i%5];e.style.animationDelay=(Math.random()*.3)+"s";$("card").appendChild(e);setTimeout(function(x){x.remove()},1700,e)}}
function pick(bt,v){
  if(locked)return;locked=true;
  if(v===ans){bt.className="right";score++;streak++;if(streak>best)best=streak;
    $("msg").textContent=cheers[rnd(0,4)]+(streak>=3?" 🔥":"");anim("win");confetti();
    if(score%5===0){$("pal").textContent=pals[(score/5)%pals.length];$("msg").textContent="Level up! 🚀"}
    setTimeout(next,950)}
  else{bt.className="wrong";streak=0;anim("lose");$("msg").textContent="Almost! It's "+ans;
    var bs=$("opts").children;for(var i=0;i<bs.length;i++)if(bs[i].textContent===ans)bs[i].className="right";setTimeout(next,1600)}
  $("score").textContent=score;$("streak").textContent=streak;$("best").textContent=best;
  $("bar").style.width=((score%5)||(score>0?5:0))*20+"%";
}
function start(id){
  S=id;score=streak=best=0;mode=0;$("score").textContent=$("streak").textContent=$("best").textContent=0;$("bar").style.width="0";
  var s=subs.filter(function(x){return x.id===id})[0];$("title").textContent=s.e+" "+s.n+" · Grade "+G;$("msg").textContent="Pick the right answer!";
  var m=$("modes");m.innerHTML="";
  if(id==="math")ops.forEach(function(o,i){var b=document.createElement("button");b.className="chip"+(i?"":" on");b.textContent=o;b.onclick=function(){mode=i;for(var j=0;j<ops.length;j++)m.children[j].className="chip"+(j===i?" on":"");next()};m.appendChild(b)});
  if(id==="math"){var rb=document.createElement("button");rb.className="chip"+(nlOn?" on":"");rb.textContent="📏";rb.title="Number line";rb.onclick=function(){nlOn=!nlOn;rb.className="chip"+(nlOn?" on":"");renderNL()};m.appendChild(rb)}
  $("home").hidden=true;$("game").hidden=false;next();
}
function goHome(){$("game").hidden=true;$("home").hidden=false}
[1,2].forEach(function(g){var b=document.createElement("button");b.textContent="Grade "+g;b.className=g===1?"on":"";b.onclick=function(){G=g;var k=$("grades").children;for(var j=0;j<k.length;j++)k[j].className=j===g-1?"on":""};$("grades").appendChild(b)});
subs.forEach(function(s,i){var b=document.createElement("button");b.className="tile";b.style.background=s.c;b.style.animationDelay=i*.08+"s";b.innerHTML="<span>"+s.e+"</span>"+s.n;b.onclick=function(){start(s.id)};$("tiles").appendChild(b)});
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}
</script>
</body>
</html>
